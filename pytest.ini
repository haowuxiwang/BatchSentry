[pytest]
# 测试配置 — 生产级
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto
# pytest-asyncio >= 0.25 弃用警告：显式声明 fixture 循环作用域（未来版本默认变 function）
asyncio_default_fixture_loop_scope = session

# 输出格式
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=api
    --cov=core
    --cov=llm
    --cov=db
    --cov=config
    --cov=main
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=90

# 标记注册
markers =
    unit: 单元测试（快速，无 IO）
    integration: 集成测试（涉及多模块协作）
    api: API 路由测试
    slow: 慢测试（>1s）
    ocr: 需要 OCR 后端的测试
    llm: 需要 LLM 后端的测试

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
